rules:
  # 1. Hardcoded Secrets & Credentials
  - id: devsecops-hardcoded-secret-key
    message: "Potential hardcoded credential or secret detected. Use environment variables or a secret manager."
    severity: ERROR
    languages: [javascript, typescript, python, go, java]
    pattern-regex: '(?i)(password|secret|api[_-]?key|access[_-]?token|private[_-]?key)\s*[:=]\s*["''][A-Za-z0-9_\-]{16,}["'']'

  - id: devsecops-hardcoded-private-key
    message: "Hardcoded private key block detected. Never commit cryptographic private keys."
    severity: ERROR
    languages: [generic]
    pattern-regex: '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'

  # 2. SQL Injection Patterns
  - id: devsecops-python-sql-injection
    message: "Unescaped string formatting in SQL query. Use parameterized queries instead."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute(f"... {$VAR} ...")
          - pattern: $CURSOR.execute("..." % ($VAR))
          - pattern: $CURSOR.execute("...".format($VAR))

  - id: devsecops-javascript-sql-injection
    message: "Potential SQL injection via template literal or string concatenation. Use parameterized queries."
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: $DB.query(`... ${$VAR} ...`)
          - pattern: $DB.query("..." + $VAR)

  # 3. Command Injection
  - id: devsecops-python-shell-true
    message: "subprocess call with shell=True is dangerous and can lead to command injection."
    severity: ERROR
    languages: [python]
    pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: devsecops-nodejs-child-process-exec
    message: "Direct execution of command strings can lead to command injection. Use execFile or spawn with argument arrays."
    severity: WARNING
    languages: [javascript, typescript]
    pattern: child_process.exec($CMD, ...)

  # 4. Insecure Cryptography & Hashing
  - id: devsecops-insecure-hash-md5-sha1
    message: "MD5 and SHA-1 are cryptographically broken. Use SHA-256 or modern password hashes (Argon2id, bcrypt)."
    severity: WARNING
    languages: [python, javascript, typescript, go, java]
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
      - pattern: md5.New()
      - pattern: sha1.New()

  # 5. Dangerous CORS Wildcard
  - id: devsecops-cors-wildcard-with-credentials
    message: "CORS configuration allows arbitrary origins with credentials enabled."
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern: |
          {
            origin: "*",
            credentials: true
          }

  # 6. Insecure Cookie Flags
  - id: devsecops-cookie-missing-security-flags
    message: "Cookie defined with httpOnly: false or secure: false. Protect cookies with httpOnly and secure flags."
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: "res.cookie($NAME, $VAL, { ..., httpOnly: false, ... })"
      - pattern: "res.cookie($NAME, $VAL, { ..., secure: false, ... })"
